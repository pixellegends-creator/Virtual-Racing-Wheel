name: Windows Companion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-companion
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VirtualRacingWheel.Companion.sln

      - name: Build
        run: dotnet build VirtualRacingWheel.Companion.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test VirtualRacingWheel.Companion.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-companion-test-results
          path: windows-companion/WindowsCompanion.Tests/TestResults/*.trx

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: windows-companion-build
          path: windows-companion/WindowsCompanion/bin/Release/net8.0-windows/
